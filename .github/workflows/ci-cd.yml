name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Backend Tests & Build
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: spendos_user
          POSTGRES_PASSWORD: spendos_password
          POSTGRES_DB: spendos_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Run backend tests
      working-directory: ./backend
      env:
        DATABASE_URL: jdbc:postgresql://localhost:5432/spendos_test
        DATABASE_USERNAME: spendos_user
        DATABASE_PASSWORD: spendos_password
      run: |
        mvn clean test

    - name: Run code quality checks
      working-directory: ./backend
      run: |
        mvn checkstyle:check
        mvn spotbugs:check

    - name: Generate coverage report
      working-directory: ./backend
      run: mvn jacoco:report

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./backend/target/site/jacoco/jacoco.xml
        flags: backend
        name: backend-coverage

    - name: Build backend
      working-directory: ./backend
      run: mvn clean package -DskipTests

  # Frontend Tests & Build
  frontend-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Run linter
      working-directory: ./frontend
      run: npm run lint

    - name: Type check
      working-directory: ./frontend
      run: npm run type-check

    - name: Run tests
      working-directory: ./frontend
      run: npm test

    - name: Build frontend
      working-directory: ./frontend
      run: npm run build

    - name: Upload dist folder
      uses: actions/upload-artifact@v3
      with:
        name: frontend-build
        path: frontend/dist

  # Security Scanning
  security:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Run OWASP Dependency Check
      working-directory: ./backend
      run: mvn org.owasp:dependency-check-maven:check

    - name: Upload dependency check report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: dependency-check-report
        path: backend/target/dependency-check-report.html

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: Run npm audit
      working-directory: ./frontend
      run: npm audit --audit-level=moderate

  # Docker Build
  docker-build:
    needs: [backend-test, frontend-test, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Container Registry
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push backend image
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push frontend image
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Integration Tests (optional, runs on main branch only)
  integration-test:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [docker-build]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Compose
      run: docker-compose --version

    - name: Start services
      run: docker-compose up -d

    - name: Wait for services
      run: |
        echo "Waiting for backend..."
        sleep 30
        docker-compose exec -T backend curl -f http://localhost:8080/api/v1/health

    - name: Run API tests
      run: |
        # Basic API health check
        curl -f http://localhost:8080/api/v1/health || exit 1

    - name: Stop services
      if: always()
      run: docker-compose down

  # Deploy notification (placeholder for Phase 16+)
  notify-deployment:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [integration-test]
    runs-on: ubuntu-latest

    steps:
    - name: Deployment notification
      run: |
        echo "✅ Build and tests passed!"
        echo "📦 Docker images ready for deployment"
        echo "🚀 Ready for Phase 16 deployment"
