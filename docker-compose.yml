services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: spendos-postgres
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-spendos_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-spendos_password}
      POSTGRES_DB: ${DATABASE_NAME:-spendos}
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=200"]
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-spendos_user} -d ${DATABASE_NAME:-spendos}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spendos-network
    restart: unless-stopped

  # Redis Cache (Optional, for future use)
  redis:
    image: redis:7-alpine
    container_name: spendos-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis_password}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spendos-network
    restart: unless-stopped
    profiles:
      - redis

  # Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spendos-backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME:-spendos}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-spendos_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-spendos_password}
      JWT_SECRET: ${JWT_SECRET:-CHANGE_ME_MINIMUM_32_CHARACTERS_LONG_RANDOM_STRING_IN_PRODUCTION}
      APP_ENV: ${APP_ENV:-development}
      APP_URL: ${APP_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      SPRING_PROFILES_ACTIVE: docker
      JAVA_TOOL_OPTIONS: -Xmx512m -Xms256m
    ports:
      # Host port is configurable because 8080 is often taken (e.g. by Jenkins)
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - spendos-network
    restart: unless-stopped

  # React Frontend (static build served by nginx, which also proxies /api to the backend)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: spendos-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - spendos-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_logs:
    driver: local

networks:
  spendos-network:
    driver: bridge

# Usage:
# Development: docker compose up --build
# With Redis: docker compose --profile redis up
# Different backend host port: BACKEND_PORT=8081 docker compose up
# Stop all: docker compose down
# Clean everything: docker compose down -v
