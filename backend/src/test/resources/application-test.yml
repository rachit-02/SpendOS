logging:
  file:
    name: target/test-logs/spendos.log
  level:
    root: WARN
    com.spendos: INFO

jwt:
  secret: test-secret-that-is-definitely-longer-than-32-bytes

cors:
  allowed-origins: http://localhost:3000

app:
  # Rate limiting has a dedicated test; everywhere else it would make tests order-dependent.
  rate-limit:
    enabled: false
  scheduling:
    enabled: false
