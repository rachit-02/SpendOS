# Local development profile (activate with --spring.profiles.active=dev)
logging:
  level:
    com.spendos: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG

app:
  environment: development

# Relaxed CORS for development (Vite dev server on 3000 or 5173)
cors:
  allowed-origins: http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173
