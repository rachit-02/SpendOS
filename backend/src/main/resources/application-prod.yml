# Production profile. All secrets come from the environment; nothing here has a default.
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10

  flyway:
    baseline-on-migrate: false
    validate-on-migrate: true

logging:
  level:
    root: WARN
    com.spendos: INFO
  file:
    name: /var/log/spendos/spendos.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30

# TLS is usually terminated at the load balancer; enable in-process TLS with SSL_ENABLED=true.
server:
  ssl:
    enabled: ${SSL_ENABLED:false}
    key-store: ${SSL_KEYSTORE_PATH:}
    key-store-password: ${SSL_KEYSTORE_PASSWORD:}
    key-store-type: PKCS12

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}

jwt:
  secret: ${JWT_SECRET}

app:
  environment: production
  url: ${APP_PRODUCTION_URL}

# Strict CORS for production (no wildcard)
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
