spring:
  profiles:
    active: production

  # Production Database - Environment variables required
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: false
    validate-on-migrate: true

logging:
  level:
    root: WARN
    com.spendos: INFO
    org.springframework: WARN
    org.springframework.security: WARN
  file:
    name: /var/log/spendos/spendos.log
    max-size: 100MB
    max-history: 30

# Strict security settings for production
server:
  ssl:
    enabled: true
    key-store: ${SSL_KEYSTORE_PATH}
    key-store-password: ${SSL_KEYSTORE_PASSWORD}
    key-store-type: PKCS12
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        same-site: strict

app:
  environment: production
  debug-mode: false
  url: ${APP_PRODUCTION_URL}

# Strict CORS for production
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
  allow-credentials: true

# Enhanced security
security:
  require-https: true
  headers-enabled: true
